name: smart_islamic_opinions
description: الجامع الذكي لآراء المذاهب الإسلامية - منصة عرض واستعراض
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  url_launcher: ^6.2.0
  google_generative_ai: ^0.4.0
  flutter_dotenv: ^5.1.0
  
  # Firebase
  firebase_core: ^2.24.2
  cloud_firestore: ^4.14.0
  
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - google-services.json
    - GoogleService-Info.plist
